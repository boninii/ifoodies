<?xml version="1.0" encoding="UTF-8"?>
<!--
  Símbolo iFoodies — fonte vetorial para exportar app icon, favicon e avatar.
  Gradiente verde IF (#2B7E23 → #1B5716), monograma "iF" e o pingo verde-folha
  (#8BD264), o gesto-assinatura da marca.
  Exportar em 1024×1024 (app icon), 512, 192, 48 e 32 (favicon).
-->
<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="verde" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2B7E23"/>
      <stop offset="1" stop-color="#1B5716"/>
    </linearGradient>
  </defs>

  <!-- Tile arredondado (squircle aproximado) -->
  <rect x="0" y="0" width="1024" height="1024" rx="307" fill="url(#verde)"/>

  <!-- Monograma "iF" em traço geométrico largo (ecoa a Unbounded) -->
  <!-- Haste do i (sem pingo) -->
  <rect x="308" y="430" width="112" height="340" rx="56" fill="#FFFFFF"/>
  <!-- Pingo verde-folha -->
  <circle cx="364" cy="318" r="64" fill="#8BD264"/>

  <!-- F -->
  <path fill="#FFFFFF" d="
    M 500 254
    h 216
    a 56 56 0 0 1 0 112
    h -104
    v 96
    h 84
    a 56 56 0 0 1 0 112
    h -84
    v 140
    a 56 56 0 0 1 -112 0
    v -404
    a 56 56 0 0 1 56 -56
    z"/>
</svg>
