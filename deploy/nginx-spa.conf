# Fallback de SPA para o app web (Expo Router faz roteamento no cliente).
#
# Sem isto, abrir /pedidos direto ou dar F5 numa rota interna devolve 404: o
# nginx procura um arquivo com esse nome e nao acha. O index.html precisa
# responder por qualquer rota desconhecida.
#
# Montar no servico do EasyPanel em: /etc/nginx/conf.d/default.conf
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
